<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Q-Economics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="stylesheet" href="Style.css">
    <style>
        body { font-family: 'Georgia', serif; }
        .font-serif { font-family: 'Georgia', serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-3xl font-serif font-bold text-gray-800 text-center mb-6">Admin Panel</h1>
        
        <!-- Simple Password Auth -->
        <div id="auth-form" class="mb-6">
            <input type="password" id="admin-password" placeholder="Enter admin password" class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:border-blue-500">
            <button onclick="login()" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-colors font-serif">Login</button>
            <p class="text-sm text-gray-600 text-center mt-2">Default password: admin123</p>
        </div>

        <!-- Upload Form (hidden until login) -->
        <div id="upload-form" class="hidden">
            <h2 class="text-2xl font-serif font-bold text-gray-800 mb-4">Upload Quiz Questions</h2>
            <p class="text-gray-600 mb-4 font-serif">Use the sample CSV template below to prepare your quiz data, then upload it here.</p>
            <form id="upload" enctype="multipart/form-data">
                <input type="file" id="quiz-file" accept=".csv,.xlsx" class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:border-blue-500">
                <label class="block text-sm font-medium text-gray-700 mb-2">Quiz Title</label>
                <input type="text" id="quiz-title" placeholder="e.g., Economics Basics Test" class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:border-blue-500">
                <label class="block text-sm font-medium text-gray-700 mb-2">Quiz Type (Multiple Choice)</label>
                <input type="text" id="quiz-type" value="multiple-choice" class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:border-blue-500" readonly>
                <button type="button" onclick="uploadQuiz()" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition-colors font-serif">Upload Quiz</button>
            </form>
            
            <!-- Download Sample -->
            <div class="mt-6 text-center">
                <a href="/sample-quiz.csv" download="sample-quiz.csv" class="inline-block bg-yellow-600 text-white px-6 py-2 rounded-lg hover:bg-yellow-700 transition-colors font-serif">
                    Download Sample CSV Template
                </a>
                <p class="text-xs text-gray-500 mt-2">Edit in Excel/Google Sheets and save as CSV. Columns: Question,OptionA,OptionB,OptionC,OptionD,CorrectAnswer (A/B/C/D)</p>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="status" class="mt-4 hidden"></div>
    </div>

    <script>
        let isLoggedIn = false;
        const adminPassword = 'admin123'; // Simple hardcoded password

        function login() {
            const password = document.getElementById('admin-password').value;
            if (password === adminPassword) {
                isLoggedIn = true;
                document.getElementById('auth-form').classList.add('hidden');
                document.getElementById('upload-form').classList.remove('hidden');
            } else {
                alert('Incorrect password');
            }
        }

        async function uploadQuiz() {
            const file = document.getElementById('quiz-file').files[0];
            const title = document.getElementById('quiz-title').value;
            if (!file || !title) {
                alert('Please select a file and enter a title');
                return;
            }

            const formData = new FormData();
            formData.append('quizFile', file);
            formData.append('title', title);

            showStatus('Uploading...', 'info');
            try {
                const response = await fetch('/admin/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (response.ok) {
                    showStatus(`Success! Uploaded ${result.questionsCount} questions.`, 'success');
                    document.getElementById('upload').reset();
                } else {
                    showStatus(result.error || 'Upload failed', 'error');
                }
            } catch (err) {
                showStatus('Network error: ' + err.message, 'error');
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `p-3 rounded-lg ${type === 'success' ? 'bg-green-100 text-green-800' : type === 'error' ? 'bg-red-100 text-red-800' : 'bg-blue-100 text-blue-800'}`;
            statusDiv.textContent = message;
            statusDiv.classList.remove('hidden');
            setTimeout(() => statusDiv.classList.add('hidden'), 5000);
        }
    </script>
</body>
</html>
