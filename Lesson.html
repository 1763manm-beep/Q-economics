<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson - Q-Economics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="stylesheet" href="Style.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <style>
        body { font-family: 'Georgia', serif; }
        .font-serif { font-family: 'Georgia', serif; }
        .lesson-article { line-height: 1.8; }
        .media-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .media-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body class="bg-gray-100">
    <nav class="bg-white border-b border-gray-300 py-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="/courses" class="text-xl font-serif font-bold text-gray-900">← Back to Courses</a>
            <a href="/" class="text-2xl font-serif font-bold text-gray-900 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
                Q-Economics
            </a>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        <div id="lessonContainer" class="bg-white rounded-xl shadow-lg p-8 max-w-4xl mx-auto">
            <p class="text-gray-500 mb-4">Loading lesson...</p>
        </div>
    </main>

    <footer class="bg-gray-100 border-t border-gray-300 py-10 mt-16">
        <div class="container mx-auto px-4 text-center text-gray-600 font-serif">
            <p>&copy; 2023 Q-Economics. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Parse URL params
            const urlParts = window.location.pathname.split('/');
            const courseId = parseInt(urlParts[urlParts.length - 2]);
            const lessonIndex = parseInt(urlParts[urlParts.length - 1]);
            if (!courseId || isNaN(lessonIndex) || lessonIndex < 0) {
                document.getElementById('lessonContainer').innerHTML = '<p class="text-red-500">Invalid lesson URL.</p>';
                return;
            }

            try {
                // Fetch course data
                const response = await fetch(`/api/courses/${courseId}`);
                if (!response.ok) throw new Error('Course not found');
                const course = await response.json();
                const content = course.content || {};
                const lessons = content.lessons || [];
                const lesson = lessons[lessonIndex];

                if (!lesson) {
                    document.getElementById('lessonContainer').innerHTML = '<p class="text-gray-600">Lesson not found.</p>';
                    return;
                }

                // Generate media HTML
                let mediaHtml = '';
                if (lesson.media_url) {
                    if (lesson.media_url.includes('youtube.com')) {
                        mediaHtml = `<div class="media-container mb-6"><iframe src="${lesson.media_url}" frameborder="0" allowfullscreen></iframe></div>`;
                    } else if (lesson.media_url.includes('.mp3') || lesson.media_url.includes('audio')) {
                        mediaHtml = `<audio controls class="w-full mb-6"><source src="${lesson.media_url}" type="audio/mpeg">Your browser does not support the audio element.</audio>`;
                    } else {
                        mediaHtml = `<img src="${lesson.media_url}" alt="Lesson media" class="w-full max-w-md rounded-lg mb-6" onerror="this.style.display='none'">`;
                    }
                }

                // Generate key points
                let keyPointsHtml = '';
                if (lesson.key_points && lesson.key_points.length > 0) {
                    keyPointsHtml = `
                        <div class="mb-6">
                            <h3 class="text-lg font-semibold text-gray-800 mb-3">Key Points</h3>
                            <ul class="space-y-2 list-disc list-inside text-gray-700">
                                ${lesson.key_points.map(point => `<li>${point}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }

                const lessonHtml = `
                    <article class="lesson-article">
                        <h1 class="text-3xl font-bold text-gray-900 mb-4 font-serif">${lesson.title}</h1>
                        <div class="bg-blue-50 p-4 rounded-lg mb-6">
                            <p class="text-gray-700 italic">Part of: ${course.module}</p>
                        </div>
                        <div class="prose max-w-none">
                            <p class="text-lg text-gray-800 mb-6">${lesson.content}</p>
                            ${keyPointsHtml}
                            ${mediaHtml}
                        </div>
                        <div class="mt-8 flex justify-between">
                            <a href="/courses" class="bg-gray-600 text-white px-6 py-2 rounded hover:bg-gray-700 transition-colors">← Back to Courses</a>
                            <a href="/course/${courseId}" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition-colors">Course Overview</a>
                        </div>
                    </article>
                `;

                document.getElementById('lessonContainer').innerHTML = lessonHtml;

                // Animate in
                gsap.from('#lessonContainer *', {duration: 0.8, y: 20, opacity: 0, stagger: 0.1, ease: "power2.out"});
            } catch (error) {
                console.error('Error loading lesson:', error);
                document.getElementById('lessonContainer').innerHTML = '<p class="text-red-500">Error loading lesson. Please try again.</p>';
            }
        });
    </script>
</body>
</html>
